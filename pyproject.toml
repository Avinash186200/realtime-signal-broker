[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigbroker"
version = "1.0.0"
description = "Real-time signal broker: WebSocket fan-out with per-topic sequence numbers, replay, auth and a resuming client SDK."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["websockets>=13", "pydantic>=2.6", "PyJWT>=2.8", "prometheus-client>=0.20"]

[project.optional-dependencies]
redis = ["redis>=5,<7"]
dev = ["pytest>=8", "hypothesis>=6.100", "redis>=5,<7", "fakeredis[lua]>=2.23", "trustme>=1.1"]

[project.scripts]
sigbroker = "sigbroker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: the full correctness rerun against results/ (minutes)"]
