name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -c constraints.txt -e ".[dev]"
      - name: Run tests (includes the full correctness rerun checked against results/correctness.json)
        run: pytest -q
      - name: Load benchmark smoke (localhost, tiny)
        run: python -m sigbroker.cli load --smoke --out /tmp/load
      - name: Demo runs end to end
        run: python -m sigbroker.cli demo --messages 30

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
